# Render Blueprint —   Pointage (Docker)
#
# Ce fichier déclare le service Render en mode Docker.
# Le Dockerfile build les 3 apps (backend + 2 frontends) en un seul container.
#
# Usage :
#   1. Push le repo sur GitHub/GitLab
#   2. Render Dashboard → New → Blueprint → sélectionner le repo
#   3. Render détecte ce fichier et crée le service
#   4. Saisir les variables d'environnement manquantes
#   5. Redéployer

services:
  # ── Application complète (Docker) ──────────────────────────
  - type: web
    name: topoint
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DEPLOY_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Saisir l'URL pooler Supabase (port 6543)
      - key: DATABASE_URL_DIRECT
        sync: false  # Saisir l'URL directe Supabase (port 5432) — pour Alembic uniquement
      - key: TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "*"  # En Docker, les frontends sont servis par le même container
